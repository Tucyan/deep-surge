<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071c28"><title>水世代 · 第一层航行 Demo</title><link rel="icon" href="data:,"><link rel="stylesheet" href="demo.css?v=navigation-v4"></head>
<body><main id="game"><div id="world" aria-label="三维海面与木筏"></div><div class="vignette"></div>
<header class="brand"><h1>水世代</h1><p>DEEP SURGE · 第一层</p></header>
<nav class="nav"><button id="craft-button">⚒ 合成</button><button id="raft-button">▦ 木筏</button><button id="log-button">☷ 航海日志</button><button id="help-button">？玩法</button><button id="settings-button">⚙ 设置</button></nav>
<section id="stats" class="stats frame" aria-label="生存状态"></section>
<div class="voyage" id="voyage"></div><div id="ap" class="ap frame"></div>
<section id="panel" class="panel frame" aria-label="当前阶段行动"></section>
<button id="spring-button" class="spring-button" hidden aria-label="涌泉：抽取本轮三张随机卡"><span>涌泉</span><strong>抽取三张</strong><small>每轮一次 · 0 AP</small></button>
<section id="battle" class="battle" aria-label="四航道战斗"></section>
<div class="raft-label">漂流之海 <span>物资决定下一步，灯火照亮归途。</span></div>
<section class="hand-area"><div class="hand-header"><span id="hand-count">手牌</span><span id="hand-tip">选择物资查看用途</span></div><div id="hand" class="hand" aria-label="手牌"></div></section>
<div id="toast" role="status" aria-live="polite"></div>
<section id="start-screen" class="start-screen"><div class="start-content"><div class="eyebrow">A CARD SURVIVAL VOYAGE</div><h2>水世代</h2><p class="start-subtitle">海洋带来物资，也带来未知。</p><p>五次航行，一层深海。<br>制造、布防、选择航路，让最后一盏灯继续亮着。</p><button id="start-button" class="primary">开始航行</button><button id="start-help">航行指南</button><label class="seed-label">航行种子 <input id="seed" type="number" value="20261003" min="0" max="4294967295"></label><small>第一版 Demo · 无 Boss · 暂无存档<br>刷新页面或重开会重新开始。本版数值用于试测。</small></div></section>
<section id="end-screen" class="end-screen" hidden></section>
<dialog id="dialog"><div id="dialog-body"></div><button id="close-dialog" class="close-dialog">关闭</button></dialog>
</main><script type="module" src="app.js?v=navigation-v4"></script></body></html>
