# Internal static origin; public access is through taskstream.xyz/deep-surge/.
server {
    listen 127.0.0.1:3183;
    server_name _;
    root /opt/deep-surge/current;
    index index.html;
    autoindex off;
    location = /deep-surge { return 308 /deep-surge/; }
    location /deep-surge/ {
        rewrite ^/deep-surge/$ /index.html break;
        rewrite ^/deep-surge/(.*)$ /$1 break;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / { return 404; }
}
